name: Promote develop to main

# develop → main の PR を手動で開く。release workflow は release PR のマージ時に同じ処理を自動で行う。
# main は protect-main ルールセットで PR 必須のため、GITHUB_TOKEN では直接 push できない。
# PR を作るだけにして、マージはリポジトリオーナーが行う。
# develop は protect-develop ルールセットで削除禁止なので、マージ後の自動削除で消えない。

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    # リポジトリオーナー以外が起動した場合は何もしない
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open pull request from develop to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/promote.sh
