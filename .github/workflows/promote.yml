name: Promote develop to main

# develop → main の PR を手動で開く。release workflow は release PR のマージ時に同じ処理を自動で行う。
# main は protect-main ルールセットで PR 必須のため、GITHUB_TOKEN では直接 push できない。
# PR を作るだけにして、マージはリポジトリオーナーが行う。
# develop は protect-develop ルールセットで削除禁止なので、マージ後の自動削除で消えない。

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# release workflow と同じグループにすると、待機中の release の run が取り消されることがあるため分ける。
# 同時に PR を作ろうとした場合は promote.sh 側で成功扱いにする。
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    # リポジトリオーナー以外が起動した場合は何もしない
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open pull request from develop to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/promote.sh
